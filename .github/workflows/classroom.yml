name: Autograding

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Run tests and calculate grade
        run: python .github/scripts/grade.py
